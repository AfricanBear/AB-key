<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A+B key Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div class="brand">
          <img id="brandLogo" class="brand-logo" alt="A+B key" width="40" height="40" />
          <div class="brand-text">
            <h1>A+B key</h1>
            <p class="subtitle">Configure command bindings and action profiles</p>
          </div>
        </div>
        <button type="button" id="saveBtn" class="btn btn-primary">Save</button>
      </header>

      <section class="card">
        <h2 class="section-label">Features</h2>
        <div class="feature-toggles">
          <label class="toggle-row">
            <input type="checkbox" id="abacumTabTitleEnabled" />
            <span class="toggle-body">
              <span class="toggle-text">Abacum: show client name in tab title</span>
              <span class="toggle-hint">Open Abacum tabs may need a refresh for this to take effect.</span>
            </span>
          </label>

          <label class="toggle-row">
            <input type="checkbox" id="lightThemeNavEnabled" />
            <span class="toggle-body">
              <span class="toggle-text">Light theme nav</span>
              <span class="toggle-hint">Applies to all <code>*.abacum.io</code> pages. Refresh if the nav does not update immediately.</span>
            </span>
            <span class="toggle-preview" aria-hidden="true">
              <figure class="preview-item">
                <img id="lightNavPreviewDefault" class="preview-img" alt="" width="36" height="36" />
                <figcaption>Default</figcaption>
              </figure>
              <figure class="preview-item">
                <img id="lightNavPreviewLight" class="preview-img" alt="" width="36" height="36" />
                <figcaption>Light nav</figcaption>
              </figure>
            </span>
          </label>

          <label class="toggle-row">
            <input type="checkbox" id="darkerModelValuesEnabled" />
            <span class="toggle-body">
              <span class="toggle-text">Darker values in model cells</span>
              <span class="toggle-hint">Model values use the grid's near-black text instead of Abacum's grey. Applies to open Abacum tabs immediately.</span>
            </span>
          </label>

          <label class="toggle-row">
            <input type="checkbox" id="datasetSelectionSumEnabled" />
            <span class="toggle-body">
              <span class="toggle-text">Selection sum in datasets</span>
              <span class="toggle-hint">Select two or more cells in a dataset Viewer to see the count, Sum and Avg of the numeric values.</span>
            </span>
          </label>

          <label class="toggle-row">
            <input type="checkbox" id="diagnosticsEnabled" />
            <span class="toggle-body">
              <span class="toggle-text">Enable diagnostics logging</span>
              <span class="toggle-hint">Logs each hotkey lookup to the browser console and outlines the matched element.</span>
            </span>
          </label>
        </div>
      </section>

      <section class="card card-config">
        <div class="card-toolbar">
          <h2 class="section-label">Configuration</h2>
          <div class="toolbar" role="toolbar" aria-label="Configuration actions">
            <button type="button" id="reloadBtn" class="btn btn-toolbar">Reload</button>
            <button type="button" id="exportBtn" class="btn btn-toolbar">Export</button>
            <button type="button" id="importBtn" class="btn btn-toolbar">Import</button>
          </div>
        </div>
        <p class="hint">Alt+1–5 click the right toolbar rail buttons by position, top to bottom; the rail differs by object type. Open the A+B key panel on an Abacum page to see what each hotkey does there.</p>
        <label class="field-label" for="configJson">JSON</label>
        <textarea id="configJson" spellcheck="false"></textarea>
      </section>

      <pre id="status" class="status" role="status"></pre>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
