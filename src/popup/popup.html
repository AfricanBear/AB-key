<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A+B key</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-shell">
    <div class="panel">
      <header class="panel-header">
        <div class="panel-header-text">
          <h1>A+B key</h1>
          <p class="subtitle">Abacum hotkeys</p>
        </div>
        <button type="button" id="optionsButton" class="panel-options-btn" title="Options" aria-label="Open options">⚙️</button>
      </header>

      <section class="bindings">
        <h2 class="section-label">Hotkeys</h2>
        <ul id="hotkeyList" class="hotkey-list"></ul>
        <p id="emptyState" class="empty-state" hidden>No hotkeys configured.</p>
      </section>

      <footer class="panel-footer" id="panelFooter" aria-label="Hotkey actions"></footer>
    </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
